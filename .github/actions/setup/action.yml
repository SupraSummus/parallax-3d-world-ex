name: Set up environment
description: Install pnpm, set up Node.js with pnpm cache, install dependencies, and add Rust's WebAssembly target

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Add Rust's WebAssembly target
      shell: bash
      run: rustup target add wasm32-unknown-unknown && rustup component add clippy rustfmt
