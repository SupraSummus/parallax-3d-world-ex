name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Run linting
        run: pnpm lint

      - name: Run knip (check for unused code)
        run: pnpm knip

      - name: Run knip production mode (check for test-only code)
        run: pnpm knip:production

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm exec vitest run
