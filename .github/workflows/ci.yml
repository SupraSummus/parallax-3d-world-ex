name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unused code (knip)
        run: pnpm knip

      - name: Test-only code (knip --production)
        run: pnpm knip:production

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
