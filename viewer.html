<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Scene Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font: 12px/1.5 ui-monospace, monospace;
        }

        canvas {
            display: block;
        }

        #panel {
            position: fixed;
            top: 12px;
            left: 12px;
            max-width: calc(100vw - 48px);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgb(20 24 32 / 0.8);
            color: #e8ecf2;
        }

        #panel button {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div id="panel">
        <div><strong>Reference 3D view</strong> (three.js): drag to orbit, right-drag to pan, scroll to zoom</div>
        <div id="info"></div>
        <button id="reset" type="button">Parallax camera</button>
        <label><input id="fog" type="checkbox" checked /> Fog</label>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
</body>

</html>
